<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glassmorphism Generator Pro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #f0f2f5;
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  color: #1a1a2e;
}

/* ===== TOP NAV BAR ===== */
.top-bar {
  background: #ffffff;
  border-bottom: 1px solid #e2e5ea;
  padding: 14px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 1px 8px rgba(0,0,0,0.06);
}

.top-bar h1 {
  font-size: 1.15rem;
  font-weight: 700;
  color: #1a1a2e;
  letter-spacing: -0.3px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.icon-badge {
  width: 34px; height: 34px;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: white; font-size: 0.85rem;
  flex-shrink: 0;
}

.shortcuts {
  font-size: 0.72rem;
  color: #94a3b8;
}

.shortcuts kbd {
  background: #f1f3f7;
  border: 1px solid #dde1e9;
  border-radius: 4px;
  padding: 1px 5px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem;
  color: #64748b;
}

/* ===== MAIN LAYOUT ===== */
.main-wrap {
  max-width: 1300px;
  margin: 0 auto;
  padding: 24px 24px 110px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* ===== CARDS ===== */
.card-block {
  background: #ffffff;
  border-radius: 14px;
  border: 1px solid #e2e5ea;
  box-shadow: 0 1px 12px rgba(0,0,0,0.05);
  overflow: hidden;
}

.card-header-bar {
  padding: 12px 20px;
  border-bottom: 1px solid #f0f2f5;
  background: #fafbfc;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.card-title {
  font-size: 0.75rem;
  font-weight: 600;
  color: #64748b;
  text-transform: uppercase;
  letter-spacing: 0.9px;
  display: flex;
  align-items: center;
  gap: 7px;
}

.card-title i { color: #6366f1; }

/* ===== PREVIEW CANVAS ===== */
.preview-canvas {
  min-height: 400px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 30% 40%, rgba(99,102,241,0.4) 0%, transparent 55%),
    radial-gradient(ellipse at 75% 65%, rgba(139,92,246,0.35) 0%, transparent 50%),
    radial-gradient(ellipse at 60% 10%, rgba(236,72,153,0.25) 0%, transparent 45%),
    linear-gradient(135deg, #1e1b4b 0%, #312e81 40%, #4c1d95 70%, #1e1b69 100%);
}

.blob1, .blob2 {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  filter: blur(45px);
  z-index: 0;
}
.blob1 { width:220px; height:220px; background:rgba(99,102,241,0.35); top:40px; left:60px; }
.blob2 { width:180px; height:180px; background:rgba(236,72,153,0.3); bottom:40px; right:80px; }

.glass-preview {
  width: 380px;
  height: 260px;
  position: relative;
  z-index: 1;
  transition: all 0.3s ease;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.glass-preview:hover { transform: scale(1.03); }

.glass-inner {
  color: rgba(255,255,255,0.9);
  font-size: 1.05rem;
  font-weight: 600;
  text-align: center;
  padding: 20px;
  letter-spacing: 0.4px;
  pointer-events: none;
}

.shape-circle  { border-radius:50% !important; width:280px !important; height:280px !important; }
.shape-button  { width:200px !important; height:56px !important; }
.shape-input   { width:340px !important; height:48px !important; }

/* preview dots */
.win-dots { display:flex; gap:5px; }
.wd { width:10px; height:10px; border-radius:50%; }
.wd-r{background:#ff5f56;} .wd-y{background:#ffbd2e;} .wd-g{background:#27c93f;}

/* ===== PRESETS ===== */
.preset-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
  padding: 16px 20px;
}

@media(max-width:800px){ .preset-grid{grid-template-columns:repeat(4,1fr);} }

.preset-item {
  height: 68px;
  border-radius: 10px;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  border: 2px solid transparent;
  position: relative;
  overflow: hidden;
}
.preset-item:hover { transform:translateY(-3px); box-shadow:0 6px 18px rgba(0,0,0,0.18); }
.preset-item.active { border-color:#6366f1; box-shadow:0 0 0 3px rgba(99,102,241,0.2); }
.preset-name {
  position:absolute; bottom:4px; left:50%; transform:translateX(-50%);
  font-size:0.6rem; color:#fff;
  background:rgba(0,0,0,0.55);
  padding:1px 6px; border-radius:4px;
  white-space:nowrap; font-weight:600; letter-spacing:0.3px;
}

/* ===== SLIDERS GRID ===== */
.controls-body { padding: 22px 24px; }

.sliders-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px 36px;
}
@media(max-width:900px){ .sliders-grid{grid-template-columns:repeat(2,1fr);} }
@media(max-width:560px){ .sliders-grid{grid-template-columns:1fr;} }

.slider-item { display:flex; flex-direction:column; gap:7px; }

.slider-label-row {
  display:flex; justify-content:space-between; align-items:center;
}

.slider-label {
  font-size: 0.75rem; font-weight: 600;
  color: #475569; text-transform: uppercase;
  letter-spacing: 0.7px;
  display: flex; align-items: center; gap: 5px;
}
.slider-label i { color: #6366f1; font-size: 0.68rem; width: 12px; }

.slider-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.73rem; font-weight: 500;
  color: #6366f1;
  background: #eef2ff;
  padding: 2px 9px;
  border-radius: 5px;
  border: 1px solid #c7d2fe;
  min-width: 54px; text-align: center;
}

/* Custom Range */
input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 5px;
  background: #e2e8f0;
  border-radius: 3px; outline: none; cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: #6366f1;
  border: 2px solid #fff;
  box-shadow: 0 1px 6px rgba(99,102,241,0.4);
  cursor: pointer; transition: transform 0.15s;
}
input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.25); }
input[type="range"]::-moz-range-thumb {
  width:16px; height:16px; border-radius:50%;
  background:#6366f1; border:2px solid #fff;
  box-shadow:0 1px 6px rgba(99,102,241,0.4); cursor:pointer;
}

.ctrl-divider {
  border: none; border-top: 1px solid #f0f2f5; margin: 20px 0;
}

/* Options Row */
.options-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
}
@media(max-width:800px){ .options-row{grid-template-columns:repeat(2,1fr);} }
@media(max-width:480px){ .options-row{grid-template-columns:1fr;} }

.option-group label {
  display: block;
  font-size: 0.75rem; font-weight: 600;
  color: #475569; text-transform: uppercase;
  letter-spacing: 0.7px; margin-bottom: 8px;
}

.form-select, .form-control {
  font-size: 0.84rem;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  color: #334155;
  background: #f8fafc;
  padding: 8px 12px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.form-select:focus, .form-control:focus {
  border-color: #6366f1;
  box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
  outline: none; background: #fff;
}
.form-select option { background:#fff; color:#334155; }

.color-row { display:flex; gap:8px; align-items:center; }
input[type="color"] {
  width:42px; height:36px;
  border-radius:8px; border:1px solid #e2e8f0;
  cursor:pointer; padding:2px; background:#f8fafc; flex-shrink:0;
}
input[type="color"]::-webkit-color-swatch-wrapper{padding:0;}
input[type="color"]::-webkit-color-swatch{border-radius:6px;border:none;}

/* ===== CODE BLOCK ===== */
.code-body {
  background: #1e1e2e;
  padding: 20px 24px;
  max-height: 190px;
  overflow-y: auto;
}
.code-body::-webkit-scrollbar{width:5px;}
.code-body::-webkit-scrollbar-track{background:#2a2a3e;}
.code-body::-webkit-scrollbar-thumb{background:#6366f1;border-radius:3px;}
.code-body pre {
  color: #a6e3a1; margin: 0;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.81rem; line-height: 1.75;
  white-space: pre-wrap; word-wrap: break-word;
}

.copy-code-btn {
  background: #2a2a3e;
  border: 1px solid rgba(99,102,241,0.4);
  color: #a6e3a1;
  padding: 4px 14px; border-radius: 6px;
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem; font-weight: 500;
  transition: all 0.2s;
}
.copy-code-btn:hover { background:#6366f1; color:#fff; border-color:#6366f1; }

/* Syntax colors */
.kw-prop { color: #89dceb; }
.kw-val  { color: #cba6f7; }
.kw-unit { color: #a6e3a1; }
.kw-fn   { color: #fab387; }

/* ===== TOOLS BOTTOM BAR ===== */
.tools-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: #ffffff;
  border-top: 1px solid #e2e5ea;
  padding: 14px 28px;
  z-index: 200;
  box-shadow: 0 -4px 24px rgba(0,0,0,0.08);
}

.tools-inner {
  max-width: 1300px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.tool-btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 20px;
  border-radius: 9px;
  font-size: 0.82rem; font-weight: 600;
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.18s;
  letter-spacing: 0.2px;
  white-space: nowrap;
  font-family: 'Inter', sans-serif;
}
.tool-btn i { font-size: 0.78rem; }

.tb-primary { background:#6366f1; color:#fff; border-color:#6366f1; }
.tb-primary:hover { background:#4f46e5; border-color:#4f46e5; box-shadow:0 4px 14px rgba(99,102,241,0.35); transform:translateY(-1px); }

.tb-secondary { background:#f8fafc; color:#475569; border-color:#e2e8f0; }
.tb-secondary:hover { background:#f1f5f9; border-color:#cbd5e1; transform:translateY(-1px); }

.tb-green { background:#f0fdf4; color:#16a34a; border-color:#bbf7d0; }
.tb-green:hover { background:#dcfce7; border-color:#86efac; transform:translateY(-1px); }

.tb-yellow { background:#fffbeb; color:#d97706; border-color:#fde68a; }
.tb-yellow:hover { background:#fef3c7; border-color:#fcd34d; transform:translateY(-1px); }

.tb-red { background:#fff1f2; color:#e11d48; border-color:#fecdd3; }
.tb-red:hover { background:#ffe4e6; border-color:#fda4af; transform:translateY(-1px); }

.t-sep { width:1px; height:28px; background:#e2e8f0; flex-shrink:0; }

/* ===== TOAST ===== */
.toast-msg {
  position: fixed; bottom: 80px; right: 28px; z-index: 9999;
  background: #1e1e2e; color: #cdd6f4;
  padding: 12px 20px; border-radius: 10px;
  font-size: 0.82rem; font-weight: 500;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  border-left: 3px solid #6366f1;
  display: none;
  animation: slideIn 0.25s ease;
  font-family: 'JetBrains Mono', monospace;
}
@keyframes slideIn {
  from{ opacity:0; transform:translateX(20px); }
  to  { opacity:1; transform:translateX(0); }
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
  <h1>
    <span class="icon-badge"><i class="fas fa-wand-magic-sparkles"></i></span>
    Glassmorphism Generator Pro
  </h1>
  <div class="shortcuts">
    <kbd>Ctrl+C</kbd> Copy &nbsp;
    <kbd>Ctrl+S</kbd> Save &nbsp;
    <kbd>Ctrl+R</kbd> Reset &nbsp;
    <kbd>Ctrl+D</kbd> Download &nbsp;
    <kbd>Space</kbd> Random
  </div>
</div>

<!-- MAIN -->
<div class="main-wrap">

  <!-- 1. PREVIEW (TOP) -->
  <div class="card-block">
    <div class="card-header-bar">
      <div class="win-dots">
        <span class="wd wd-r"></span>
        <span class="wd wd-y"></span>
        <span class="wd wd-g"></span>
      </div>
      <div class="card-title"><i class="fas fa-eye"></i> Live Preview</div>
      <span style="font-size:0.72rem;color:#94a3b8;">Hover to interact</span>
    </div>
    <div class="preview-canvas" id="previewCanvas">
      <div class="blob1"></div>
      <div class="blob2"></div>
      <div class="glass-preview" id="glassPreview">
        <div class="glass-inner">Glassmorphism Effect</div>
      </div>
    </div>
  </div>

  <!-- 2. PRESETS -->
  <div class="card-block">
    <div class="card-header-bar">
      <div class="card-title"><i class="fas fa-palette"></i> Preset Library</div>
      <span style="font-size:0.72rem;color:#94a3b8;">Click any preset to apply</span>
    </div>
    <div class="preset-grid" id="presetGrid"></div>
  </div>

  <!-- 3. CONTROLS -->
  <div class="card-block">
    <div class="card-header-bar">
      <div class="card-title"><i class="fas fa-sliders"></i> Controls</div>
    </div>
    <div class="controls-body">

      <!-- Sliders -->
      <div class="sliders-grid">

        <div class="slider-item">
          <div class="slider-label-row">
            <span class="slider-label"><i class="fas fa-droplet"></i> Blur</span>
            <span class="slider-val" id="blurVal">15px</span>
          </div>
          <input type="range" id="blurSlider" min="0" max="50" value="15">
        </div>

        <div class="slider-item">
          <div class="slider-label-row">
            <span class="slider-label"><i class="fas fa-circle-half-stroke"></i> Opacity</span>
            <span class="slider-val" id="opacityVal">0.20</span>
          </div>
          <input type="range" id="opacitySlider" min="0" max="1" step="0.01" value="0.2">
        </div>

        <div class="slider-item">
          <div class="slider-label-row">
            <span class="slider-label"><i class="fas fa-vector-square"></i> Radius</span>
            <span class="slider-val" id="radiusVal">20px</span>
          </div>
          <input type="range" id="radiusSlider" min="0" max="100" value="20">
        </div>

        <div class="slider-item">
          <div class="slider-label-row">
            <span class="slider-label"><i class="fas fa-border-all"></i> Border</span>
            <span class="slider-val" id="borderWidthVal">1px</span>
          </div>
          <input type="range" id="borderWidthSlider" min="0" max="5" step="0.5" value="1">
        </div>

        <div class="slider-item">
          <div class="slider-label-row">
            <span class="slider-label"><i class="fas fa-clone"></i> Shadow</span>
            <span class="slider-val" id="shadowVal">0.30</span>
          </div>
          <input type="range" id="shadowSlider" min="0" max="1" step="0.01" value="0.3">
        </div>

        <div class="slider-item">
          <div class="slider-label-row">
            <span class="slider-label"><i class="fas fa-sun"></i> Saturation</span>
            <span class="slider-val" id="saturationVal">100%</span>
          </div>
          <input type="range" id="saturationSlider" min="50" max="200" value="100">
        </div>

      </div><!-- /sliders-grid -->

      <hr class="ctrl-divider">

      <!-- Options -->
      <div class="options-row">

        <div class="option-group">
          <label><i class="fas fa-fill-drip" style="color:#6366f1;margin-right:4px;"></i>Color Mode</label>
          <select class="form-select" id="colorMode">
            <option value="solid">Solid Color</option>
            <option value="gradient">Gradient</option>
          </select>
        </div>

        <div class="option-group" id="solidColorGroup">
          <label><i class="fas fa-palette" style="color:#6366f1;margin-right:4px;"></i>Glass Color</label>
          <div class="color-row">
            <input type="color" id="solidColor" value="#ffffff">
            <input type="text" class="form-control" id="solidColorHex" value="#ffffff">
          </div>
        </div>

        <div class="option-group d-none" id="gradientGroup">
          <label><i class="fas fa-swatchbook" style="color:#6366f1;margin-right:4px;"></i>Gradient</label>
          <div class="color-row mb-2">
            <input type="color" id="gradientColor1" value="#ffffff">
            <input type="text" class="form-control" id="gradientHex1" value="#ffffff">
          </div>
          <div class="color-row">
            <input type="color" id="gradientColor2" value="#e0e7ff">
            <input type="text" class="form-control" id="gradientHex2" value="#e0e7ff">
          </div>
        </div>

        <div class="option-group">
          <label><i class="fas fa-shapes" style="color:#6366f1;margin-right:4px;"></i>Shape</label>
          <select class="form-select" id="shapeSelect">
            <option value="card">Card</option>
            <option value="circle">Circle</option>
            <option value="button">Button</option>
            <option value="input">Input Field</option>
          </select>
        </div>

      </div>

    </div>
  </div><!-- /controls -->

  <!-- 4. CSS CODE -->
  <div class="card-block">
    <div class="card-header-bar">
      <div class="card-title"><i class="fas fa-code"></i> Generated CSS</div>
      <button class="copy-code-btn" onclick="copyCurrentCode()">
        <i class="fas fa-copy"></i> Copy
      </button>
    </div>
    <div class="code-body">
      <pre id="codeOutput"></pre>
    </div>
  </div>

</div><!-- /main-wrap -->

<!-- TOOLS BAR (BOTTOM STICKY) -->
<div class="tools-bar">
  <div class="tools-inner">
    <button class="tool-btn tb-primary" onclick="copyCode()">
      <i class="fas fa-copy"></i> Copy CSS
    </button>
    <div class="t-sep"></div>
    <button class="tool-btn tb-green" onclick="saveCustomPreset()">
      <i class="fas fa-floppy-disk"></i> Save Preset
    </button>
    <button class="tool-btn tb-secondary" onclick="loadCustomPreset()">
      <i class="fas fa-folder-open"></i> Load Preset
    </button>

    <div class="t-sep"></div>
    <button class="tool-btn tb-yellow" onclick="randomize()">
      <i class="fas fa-dice"></i> Random
    </button>
    <button class="tool-btn tb-red" onclick="resetToDefault()">
      <i class="fas fa-rotate-left"></i> Reset
    </button>
  </div>
</div>

<!-- Toast -->
<div class="toast-msg" id="toast"></div>

<script>
const presets = [
  { name:'Classic', blur:15, opacity:0.20, radius:20, borderWidth:1,   shadow:0.30, saturation:100, color:'#ffffff',  mode:'solid' },
  { name:'Frosted', blur:25, opacity:0.15, radius:15, borderWidth:1.5, shadow:0.40, saturation:90,  color:'#f0f0f0',  mode:'solid' },
  { name:'Crystal', blur:8,  opacity:0.10, radius:25, borderWidth:0.5, shadow:0.20, saturation:120, color:'#ffffff',  mode:'solid' },
  { name:'Vibrant', blur:20, opacity:0.25, radius:30, borderWidth:2,   shadow:0.50, saturation:150, color1:'#ff6b9d', color2:'#c94b4b', mode:'gradient' },
  { name:'Ocean',   blur:18, opacity:0.20, radius:20, borderWidth:1,   shadow:0.35, saturation:110, color1:'#4facfe', color2:'#00f2fe', mode:'gradient' },
  { name:'Sunset',  blur:22, opacity:0.18, radius:25, borderWidth:1.5, shadow:0.40, saturation:130, color1:'#fa709a', color2:'#fee140', mode:'gradient' },
  { name:'Mint',    blur:16, opacity:0.22, radius:18, borderWidth:1,   shadow:0.30, saturation:105, color1:'#a8edea', color2:'#fed6e3', mode:'gradient' },
  { name:'Neon',    blur:12, opacity:0.15, radius:15, borderWidth:2,   shadow:0.50, saturation:180, color1:'#f857a6', color2:'#ff5858', mode:'gradient' },
];

document.addEventListener('DOMContentLoaded', () => {
  buildPresets();
  bindEvents();
  updatePreview();
});

function buildPresets() {
  const grid = document.getElementById('presetGrid');
  presets.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'preset-item';
    const bg = p.mode === 'solid'
      ? hexRGBA(p.color, p.opacity)
      : `linear-gradient(135deg,${hexRGBA(p.color1,p.opacity)},${hexRGBA(p.color2,p.opacity)})`;
    el.style.cssText = `background:${bg};backdrop-filter:blur(${p.blur}px);border-radius:${p.radius}px;box-shadow:0 4px 12px rgba(0,0,0,${p.shadow});`;
    el.innerHTML = `<span class="preset-name">${p.name}</span>`;
    el.onclick = () => applyPreset(i);
    grid.appendChild(el);
  });
}

function bindEvents() {
  ['blur','opacity','radius','borderWidth','shadow','saturation'].forEach(id => {
    document.getElementById(id+'Slider').addEventListener('input', updatePreview);
  });
  document.getElementById('colorMode').addEventListener('change', toggleColorMode);
  document.getElementById('shapeSelect').addEventListener('change', updatePreview);

  const pairs = [
    ['solidColor','solidColorHex'],
    ['gradientColor1','gradientHex1'],
    ['gradientColor2','gradientHex2'],
  ];
  pairs.forEach(([c,h]) => {
    document.getElementById(c).addEventListener('input', e => {
      document.getElementById(h).value = e.target.value; updatePreview();
    });
    document.getElementById(h).addEventListener('input', e => {
      if(/^#[0-9A-Fa-f]{6}$/.test(e.target.value)){
        document.getElementById(c).value = e.target.value; updatePreview();
      }
    });
  });
}

function hexRGBA(hex, a) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function getV() {
  return {
    blur:        +document.getElementById('blurSlider').value,
    opacity:     +document.getElementById('opacitySlider').value,
    radius:      +document.getElementById('radiusSlider').value,
    borderWidth: +document.getElementById('borderWidthSlider').value,
    shadow:      +document.getElementById('shadowSlider').value,
    saturation:  +document.getElementById('saturationSlider').value,
    colorMode:    document.getElementById('colorMode').value,
    solidColor:   document.getElementById('solidColor').value,
    color1:       document.getElementById('gradientColor1').value,
    color2:       document.getElementById('gradientColor2').value,
    shape:        document.getElementById('shapeSelect').value,
  };
}

function updatePreview() {
  const v = getV();

  // Update value badges
  document.getElementById('blurVal').textContent       = v.blur+'px';
  document.getElementById('opacityVal').textContent    = v.opacity.toFixed(2);
  document.getElementById('radiusVal').textContent     = v.radius+'px';
  document.getElementById('borderWidthVal').textContent= v.borderWidth+'px';
  document.getElementById('shadowVal').textContent     = v.shadow.toFixed(2);
  document.getElementById('saturationVal').textContent = v.saturation+'%';

  const el = document.getElementById('glassPreview');
  el.classList.remove('shape-circle','shape-button','shape-input');
  if(v.shape !== 'card') el.classList.add('shape-'+v.shape);

  const bg = v.colorMode==='solid'
    ? hexRGBA(v.solidColor, v.opacity)
    : `linear-gradient(135deg,${hexRGBA(v.color1,v.opacity)},${hexRGBA(v.color2,v.opacity)})`;

  el.style.backdropFilter       = `blur(${v.blur}px) saturate(${v.saturation}%)`;
  el.style.webkitBackdropFilter = `blur(${v.blur}px) saturate(${v.saturation}%)`;
  el.style.background     = bg;
  el.style.borderRadius   = v.radius+'px';
  el.style.border         = `${v.borderWidth}px solid rgba(255,255,255,0.35)`;
  el.style.boxShadow      = `0 8px 32px rgba(0,0,0,${v.shadow})`;

  updateCode(v, bg);
}

function toggleColorMode() {
  const m = document.getElementById('colorMode').value;
  document.getElementById('solidColorGroup').classList.toggle('d-none', m!=='solid');
  document.getElementById('gradientGroup').classList.toggle('d-none', m==='solid');
  updatePreview();
}

function buildCSS(v, bg) {
  return `.glass {\n  backdrop-filter: blur(${v.blur}px) saturate(${v.saturation}%);\n  -webkit-backdrop-filter: blur(${v.blur}px) saturate(${v.saturation}%);\n  background: ${bg};\n  border-radius: ${v.radius}px;\n  border: ${v.borderWidth}px solid rgba(255, 255, 255, 0.35);\n  box-shadow: 0 8px 32px rgba(0, 0, 0, ${v.shadow});\n}`;
}

function updateCode(v, bg) {
  const raw = buildCSS(v, bg);
  document.getElementById('codeOutput').innerHTML = raw
    .replace(/([\w-]+)(?=\s*:)/g,'<span class="kw-prop">$1</span>')
    .replace(/:\s*([^;{}\n]+);/g,': <span class="kw-val">$1</span>;')
    .replace(/(\d+(?:\.\d+)?)(px|%)/g,'<span class="kw-unit">$1$2</span>')
    .replace(/\b(blur|saturate|rgba|linear-gradient)\b/g,'<span class="kw-fn">$1</span>');
}

function copyCode() {
  const v=getV(), bg=v.colorMode==='solid'?hexRGBA(v.solidColor,v.opacity):`linear-gradient(135deg,${hexRGBA(v.color1,v.opacity)},${hexRGBA(v.color2,v.opacity)})`;
  navigator.clipboard.writeText(buildCSS(v,bg)).then(()=>toast('✅ CSS copied!'));
}

function copyCurrentCode() {
  navigator.clipboard.writeText(document.getElementById('codeOutput').textContent).then(()=>toast('✅ Code copied!'));
}

function applyPreset(i) {
  const p=presets[i];
  document.getElementById('blurSlider').value        = p.blur;
  document.getElementById('opacitySlider').value     = p.opacity;
  document.getElementById('radiusSlider').value      = p.radius;
  document.getElementById('borderWidthSlider').value = p.borderWidth;
  document.getElementById('shadowSlider').value      = p.shadow;
  document.getElementById('saturationSlider').value  = p.saturation;
  document.getElementById('colorMode').value         = p.mode;
  if(p.mode==='solid'){
    document.getElementById('solidColor').value=p.color;
    document.getElementById('solidColorHex').value=p.color;
  } else {
    document.getElementById('gradientColor1').value=p.color1;
    document.getElementById('gradientHex1').value=p.color1;
    document.getElementById('gradientColor2').value=p.color2;
    document.getElementById('gradientHex2').value=p.color2;
  }
  toggleColorMode();
  document.querySelectorAll('.preset-item').forEach((el,j)=>el.classList.toggle('active',j===i));
  toast(`✨ ${p.name} preset loaded!`);
}

function saveCustomPreset() {
  localStorage.setItem('glassPreset', JSON.stringify(getV()));
  toast('✅ Preset saved!');
}

function loadCustomPreset() {
  const p=JSON.parse(localStorage.getItem('glassPreset'));
  if(!p){toast('❌ No saved preset!');return;}
  document.getElementById('blurSlider').value        = p.blur;
  document.getElementById('opacitySlider').value     = p.opacity;
  document.getElementById('radiusSlider').value      = p.radius;
  document.getElementById('borderWidthSlider').value = p.borderWidth;
  document.getElementById('shadowSlider').value      = p.shadow;
  document.getElementById('saturationSlider').value  = p.saturation;
  document.getElementById('colorMode').value         = p.colorMode;
  document.getElementById('solidColor').value        = p.solidColor;
  document.getElementById('solidColorHex').value     = p.solidColor;
  document.getElementById('gradientColor1').value    = p.color1;
  document.getElementById('gradientHex1').value      = p.color1;
  document.getElementById('gradientColor2').value    = p.color2;
  document.getElementById('gradientHex2').value      = p.color2;
  toggleColorMode();
  toast('✅ Preset loaded!');
}

function resetToDefault() {
  document.getElementById('blurSlider').value=15;
  document.getElementById('opacitySlider').value=0.2;
  document.getElementById('radiusSlider').value=20;
  document.getElementById('borderWidthSlider').value=1;
  document.getElementById('shadowSlider').value=0.3;
  document.getElementById('saturationSlider').value=100;
  document.getElementById('colorMode').value='solid';
  document.getElementById('solidColor').value='#ffffff';
  document.getElementById('solidColorHex').value='#ffffff';
  document.getElementById('shapeSelect').value='card';
  toggleColorMode();
  document.querySelectorAll('.preset-item').forEach(el=>el.classList.remove('active'));
  toast('🔄 Reset done!');
}

function randomize() {
  const c1='#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0');
  const c2='#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0');
  const m=Math.random()>0.5?'gradient':'solid';
  document.getElementById('blurSlider').value        = Math.floor(Math.random()*40)+5;
  document.getElementById('opacitySlider').value     = +(Math.random()*0.3+0.1).toFixed(2);
  document.getElementById('radiusSlider').value      = Math.floor(Math.random()*80)+5;
  document.getElementById('borderWidthSlider').value = +(Math.random()*3+0.5).toFixed(1);
  document.getElementById('shadowSlider').value      = +(Math.random()*0.6+0.2).toFixed(2);
  document.getElementById('saturationSlider').value  = Math.floor(Math.random()*100)+80;
  document.getElementById('colorMode').value=m;
  if(m==='solid'){
    document.getElementById('solidColor').value=c1;
    document.getElementById('solidColorHex').value=c1;
  } else {
    document.getElementById('gradientColor1').value=c1;document.getElementById('gradientHex1').value=c1;
    document.getElementById('gradientColor2').value=c2;document.getElementById('gradientHex2').value=c2;
  }
  toggleColorMode();
  document.querySelectorAll('.preset-item').forEach(el=>el.classList.remove('active'));
  toast('🎲 Random style!');
}

function downloadHTML() {
  const v=getV(), bg=v.colorMode==='solid'?hexRGBA(v.solidColor,v.opacity):`linear-gradient(135deg,${hexRGBA(v.color1,v.opacity)},${hexRGBA(v.color2,v.opacity)})`;
  const html=`<!DOCTYPE html>\n<html>\n<head><meta charset="UTF-8"><title>Glass Effect</title>\n<style>\nbody{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e1b4b,#312e81,#4c1d95);font-family:Arial,sans-serif;}\n.glass{backdrop-filter:blur(${v.blur}px) saturate(${v.saturation}%);-webkit-backdrop-filter:blur(${v.blur}px) saturate(${v.saturation}%);background:${bg};border-radius:${v.radius}px;border:${v.borderWidth}px solid rgba(255,255,255,0.35);box-shadow:0 8px 32px rgba(0,0,0,${v.shadow});padding:40px;color:#fff;max-width:400px;}\n.glass h2{margin:0 0 15px;font-size:2rem;}\n.glass p{margin:0;opacity:0.9;}\n</style></head>\n<body><div class="glass"><h2>Glassmorphism Card</h2><p>Beautiful glass effect.</p></div></body></html>`;
  const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(new Blob([html],{type:'text/html'})),download:'glassmorphism.html'});
  a.click();
  toast('📥 HTML downloaded!');
}

function toast(msg) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.style.display='block';
  setTimeout(()=>el.style.display='none',3000);
}

document.addEventListener('keydown',e=>{
  const t=document.activeElement.tagName;
  if((e.ctrlKey||e.metaKey)&&e.key==='c'&&t!=='INPUT'){e.preventDefault();copyCode();}
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();saveCustomPreset();}
  if((e.ctrlKey||e.metaKey)&&e.key==='r'){e.preventDefault();resetToDefault();}
  if((e.ctrlKey||e.metaKey)&&e.key==='d'){e.preventDefault();downloadHTML();}
  if(e.key===' '&&t!=='INPUT'){e.preventDefault();randomize();}
});
</script>
</body>
</html>
